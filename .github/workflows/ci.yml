name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Floors are a few points below the current tree (~70% line / ~62% branch)
  # so legitimate refactors do not turn the gate into a treadmill.
  MIN_LINE_COVERAGE: '65'
  MIN_BRANCH_COVERAGE: '55'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Verify formatting
        # The tree is LF, and `.editorconfig` has no EOL rule, so the Linux
        # runner is the deterministic host for the whitespace gate.
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format whitespace CCISharp.sln --verify-no-changes --no-restore

      - name: Test
        shell: pwsh
        run: |
          $testArgs = @(
            '--no-build', '--configuration', 'Release',
            '--logger', 'trx;LogFileName=results.trx',
            '--results-directory', 'TestResults'
          )
          if ('${{ matrix.os }}' -eq 'windows-latest') {
            $testArgs += '--collect:XPlat Code Coverage'
          }
          dotnet test CCISharp.Tests/CCISharp.Tests.csproj @testArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Coverage summary
        # Merges the per-TFM cobertura reports, writes line/branch coverage to
        # the job summary and enforces the floors. Windows runs the libCCI
        # interop tests, so it is also the representative coverage run.
        if: always() && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem TestResults -Recurse -Filter coverage.cobertura.xml -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) {
            Write-Warning 'No coverage report found.'
            exit 0
          }

          $linesValid = 0; $linesCovered = 0; $branchesValid = 0; $branchesCovered = 0
          foreach ($file in $files) {
            [xml]$report = Get-Content -LiteralPath $file.FullName
            $linesValid += [int]$report.coverage.'lines-valid'
            $linesCovered += [int]$report.coverage.'lines-covered'
            $branchesValid += [int]$report.coverage.'branches-valid'
            $branchesCovered += [int]$report.coverage.'branches-covered'
          }

          if ($linesValid -eq 0) {
            Write-Warning 'Coverage report contains no lines.'
            exit 0
          }

          $lineRate = 100.0 * $linesCovered / $linesValid
          $branchRate = if ($branchesValid -gt 0) { 100.0 * $branchesCovered / $branchesValid } else { 100.0 }
          $floor = [double]$env:MIN_LINE_COVERAGE
          $branchFloor = [double]$env:MIN_BRANCH_COVERAGE

          @(
            '### Test coverage',
            '',
            '| Metric | Covered | Total | Rate |',
            '| --- | ---: | ---: | ---: |',
            ('| Lines | {0:N0} | {1:N0} | {2:N1}% |' -f $linesCovered, $linesValid, $lineRate),
            ('| Branches | {0:N0} | {1:N0} | {2:N1}% |' -f $branchesCovered, $branchesValid, $branchRate),
            '',
            ('Line-coverage floor: {0:N0}%. Branch-coverage floor: {1:N0}%.' -f $floor, $branchFloor)
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          if ($lineRate -lt $floor) {
            Write-Error ('Line coverage {0:N1}% is below the {1:N0}% floor.' -f $lineRate, $floor)
            exit 1
          }

          if ($branchRate -lt $branchFloor) {
            Write-Error ('Branch coverage {0:N1}% is below the {1:N0}% floor.' -f $branchRate, $branchFloor)
            exit 1
          }

      - name: Upload test results
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

      - name: Upload coverage report
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            global.json

      - name: Restore
        run: dotnet restore

      - name: Fail on vulnerable NuGet packages
        # NuGet audit already surfaces advisories during restore; this gate makes
        # a known-vulnerable direct or transitive package fail the build.
        run: |
          dotnet list CCISharp.sln package --vulnerable --include-transitive --no-restore | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages detected (see the step log)."
            exit 1
          fi

      - name: Deprecated packages (informational)
        continue-on-error: true
        run: dotnet list CCISharp.sln package --deprecated --no-restore

  pack:
    name: pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Package only when every gate is green: a tag push then publishes exactly
    # what CI validated.
    needs: [build-and-test, dependency-audit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Pack
        # Package validation compares against the published 1.0.0 baseline
        # (PackageValidationBaselineVersion), so an accidental API break fails
        # here instead of in a consumer's build.
        run: dotnet pack CCISharp/CCISharp.csproj --no-build --configuration Release --output ./artifacts

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nuget-packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          if-no-files-found: error

  publish:
    name: publish to NuGet
    runs-on: ubuntu-latest
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    environment: nuget
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Download NuGet artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Push to NuGet
        # Package first, then symbols (symbols require the package to exist).
        # --skip-duplicate makes a re-run idempotent.
        run: |
          dotnet nuget push ./artifacts/*.nupkg --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push ./artifacts/*.snupkg --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
